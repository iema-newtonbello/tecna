<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5B176F">
  <meta name="description" content="Tecna — plataforma estudantil para criar, acompanhar e compartilhar projetos.">
  <title>Tecna | Projetos que conectam</title>
  <style>
    :root {
      --purple-950: #321047;
      --purple-900: #4B1262;
      --purple-800: #5B176F;
      --purple-700: #70227F;
      --purple-600: #85428F;
      --purple-500: #A275AE;
      --purple-200: #DECBE2;
      --purple-100: #F1E8F3;
      --pink-500: #D16AA6;
      --green-500: #A8D719;
      --green-600: #8FBE0B;
      --green-100: #EEF8C9;
      --blue-500: #4778C8;
      --slate-950: #241A2B;
      --slate-700: #51465A;
      --slate-500: #766B7D;
      --slate-300: #D5CDD9;
      --slate-200: #E9E2EB;
      --slate-100: #F6F3F7;
      --surface: #FFFFFF;
      --page: #FCFAFD;
      --danger: #C62828;
      --shadow: 0 18px 45px rgba(75, 18, 98, .12);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; color: var(--slate-950); background: var(--page); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid rgba(168, 215, 25, .55); outline-offset: 3px; }
    .app-shell { min-height: 100vh; }
    .hidden { display: none !important; }

    .login-screen { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(420px, .92fr); background: var(--surface); }
    .login-visual { position: relative; min-height: 100vh; overflow: hidden; isolation: isolate; color: #fff; background: radial-gradient(circle at 14% 18%, rgba(209, 106, 166, .33), transparent 26%), radial-gradient(circle at 83% 76%, rgba(162, 117, 174, .48), transparent 30%), linear-gradient(145deg, #321047 0%, #5B176F 54%, #85428F 100%); }
    .login-visual::before, .login-visual::after { content: ""; position: absolute; z-index: -1; border-radius: 999px; filter: blur(4px); opacity: .35; animation: float 10s ease-in-out infinite alternate; }
    .login-visual::before { width: 360px; height: 360px; top: 18%; left: 8%; background: rgba(209, 106, 166, .3); }
    .login-visual::after { width: 480px; height: 480px; right: -12%; bottom: -18%; background: rgba(168, 215, 25, .12); animation-delay: -3s; }
    #network-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .72; }
    .visual-content { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; padding: clamp(32px, 6vw, 86px); }
    .brand-lockup { display: inline-flex; align-items: center; gap: 12px; width: fit-content; }
    .brand-logo { display: block; width: 170px; height: auto; object-fit: contain; }
    .visual-logo { width: min(290px, 66vw); padding: 12px; border-radius: 18px; background: rgba(255, 255, 255, .94); box-shadow: 0 14px 30px rgba(25, 6, 35, .16); }
    .sidebar-logo { width: 150px; margin: 0 auto 30px; border-radius: 12px; }
    .mobile-logo { width: 160px; margin-bottom: 28px; }
    .hero-copy { max-width: 620px; margin: auto 0; padding: 48px 0; }
    .hero-copy .eyebrow { color: #F4E8F5; }
    .eyebrow { margin: 0; color: var(--purple-700); font-size: .77rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .hero-copy h1 { max-width: 610px; margin: 16px 0; font-size: clamp(2.5rem, 5vw, 5.3rem); line-height: .98; letter-spacing: -.065em; }
    .hero-copy p { max-width: 520px; margin: 0; color: #F1E8F3; font-size: clamp(1rem, 1.6vw, 1.22rem); line-height: 1.7; }
    .hero-keywords { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .hero-keywords span { padding: 9px 13px; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; background: rgba(255,255,255,.1); backdrop-filter: blur(8px); }
    .login-panel { display: grid; place-items: center; padding: 42px clamp(22px, 6vw, 86px); background: linear-gradient(180deg, #fff 0%, #FCFAFD 100%); }
    .auth-card { width: min(100%, 440px); }
    .mobile-brand { display: none; }
    .auth-card h2 { margin: 12px 0 10px; color: var(--purple-950); font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -.045em; }
    .auth-intro { margin: 0 0 30px; color: var(--slate-500); line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--slate-700); font-size: .9rem; font-weight: 700; }
    .input-wrap { position: relative; }
    .input, .select, .textarea { width: 100%; border: 1px solid var(--slate-200); border-radius: var(--radius-sm); padding: 14px 15px; color: var(--slate-950); background: #fff; transition: border-color .2s, box-shadow .2s; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--purple-600); box-shadow: 0 0 0 4px rgba(133, 66, 143, .14); outline: none; }
    .password-input { padding-right: 50px; }
    .toggle-password { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); padding: 7px; color: var(--slate-500); border: 0; background: transparent; }
    .password-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -4px; margin-bottom: 22px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; color: var(--slate-500); font-size: .86rem; }
    .checkbox-label input { accent-color: var(--green-600); }
    .text-button { padding: 0; color: var(--purple-700); font-weight: 700; border: 0; background: transparent; }
    .text-button:hover { color: var(--pink-500); }
    .primary-button, .secondary-button, .danger-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; border-radius: var(--radius-sm); padding: 12px 18px; font-weight: 800; transition: transform .2s, box-shadow .2s, background .2s; }
    .primary-button { width: 100%; color: var(--purple-950); border: 1px solid var(--green-600); background: linear-gradient(135deg, var(--green-500), #C8ED50); box-shadow: 0 10px 20px rgba(143, 190, 11, .22); }
    .primary-button:hover, .secondary-button:hover, .danger-button:hover { transform: translateY(-2px); }
    .secondary-button { color: var(--purple-800); border: 1px solid var(--purple-200); background: var(--purple-100); }
    .danger-button { color: #fff; border: 1px solid var(--danger); background: var(--danger); }
    .button-small { min-height: 38px; padding: 9px 13px; font-size: .82rem; }
    .auth-divider { display: flex; align-items: center; gap: 14px; margin: 24px 0; color: var(--slate-500); font-size: .82rem; }
    .auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: var(--slate-200); }
    .auth-footer { margin-top: 26px; color: var(--slate-500); font-size: .9rem; text-align: center; }
    .auth-message { min-height: 22px; margin: 12px 0; color: var(--danger); font-size: .88rem; }

    .app-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 26px 16px; background: linear-gradient(180deg, var(--purple-950), var(--purple-900)); color: #fff; }
    .sidebar-nav { display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; color: #E5D5E9; border: 0; border-radius: 12px; background: transparent; text-align: left; }
    .nav-item:hover, .nav-item.active { color: #fff; background: rgba(162, 117, 174, .32); }
    .nav-icon { width: 22px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid rgba(255,255,255,.1); }
    .profile-mini { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .avatar { display: grid; flex: 0 0 auto; width: 40px; height: 40px; place-items: center; color: var(--purple-900); font-weight: 900; border-radius: 50%; background: linear-gradient(135deg, #F5D4E7, #DECBE2); }
    .profile-mini strong { display: block; font-size: .9rem; }
    .profile-mini small { color: #DECBE2; }
    .logout-button { width: 100%; padding: 10px 0; color: #F5D4E7; border: 0; background: transparent; text-align: left; }
    .main-content { min-width: 0; padding: 28px clamp(18px, 4vw, 54px) 54px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
    .topbar h1 { margin: 0; color: var(--purple-950); font-size: clamp(1.7rem, 3vw, 2.6rem); letter-spacing: -.04em; }
    .topbar p { margin: 7px 0 0; color: var(--slate-500); }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .icon-button { display: grid; width: 42px; height: 42px; place-items: center; color: var(--purple-800); border: 1px solid var(--slate-200); border-radius: 12px; background: #fff; }
    .menu-button { display: none; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card, .content-card { border: 1px solid rgba(233, 226, 235, .9); border-radius: var(--radius-md); background: var(--surface); box-shadow: 0 8px 24px rgba(75, 18, 98, .05); }
    .stat-card { padding: 20px; }
    .stat-label { color: var(--slate-500); font-size: .84rem; }
    .stat-value { margin-top: 9px; color: var(--purple-950); font-size: 1.75rem; font-weight: 900; }
    .stat-trend { margin-top: 9px; color: #5E8300; font-size: .8rem; font-weight: 700; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .8fr); gap: 22px; }
    .content-card { padding: 22px; }
    .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .card-heading h2 { margin: 0; color: var(--purple-950); font-size: 1.12rem; }
    .card-heading p { margin: 5px 0 0; color: var(--slate-500); font-size: .85rem; }
    .link-button { padding: 0; color: var(--purple-700); border: 0; background: transparent; font-size: .84rem; font-weight: 800; }
    .project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .project-card { overflow: hidden; border: 1px solid var(--slate-200); border-radius: 14px; background: #fff; }
    .project-cover { position: relative; display: flex; align-items: flex-end; height: 126px; padding: 15px; color: #fff; background: linear-gradient(135deg, var(--purple-700), var(--pink-500)); }
    .project-cover.green { background: linear-gradient(135deg, var(--purple-800), var(--green-600)); }
    .project-cover.blue { background: linear-gradient(135deg, var(--purple-900), var(--blue-500)); }
    .project-cover h3 { position: relative; z-index: 1; margin: 0; font-size: 1.05rem; }
    .project-cover::after { content: "✦"; position: absolute; top: -16px; right: 18px; color: rgba(255,255,255,.28); font-size: 7rem; transform: rotate(18deg); }
    .project-body { padding: 15px; }
    .project-body p { display: -webkit-box; overflow: hidden; min-height: 38px; margin: 0 0 14px; color: var(--slate-500); font-size: .83rem; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; color: var(--slate-500); font-size: .76rem; font-weight: 700; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: var(--slate-100); }
    .progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--purple-700), var(--green-500)); }
    .project-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; color: var(--slate-500); font-size: .76rem; }
    .status-pill { padding: 4px 8px; color: #587900; border-radius: 999px; background: var(--green-100); font-weight: 800; }
    .status-pill.purple { color: var(--purple-800); background: var(--purple-100); }
    .poll-box { padding: 18px; border-radius: 14px; background: linear-gradient(135deg, var(--purple-100), #FCF0F7); }
    .poll-box h3 { margin: 0 0 8px; color: var(--purple-950); font-size: 1rem; }
    .poll-box p { margin: 0 0 15px; color: var(--slate-500); font-size: .84rem; line-height: 1.5; }
    .poll-option { display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 8px; padding: 10px; color: var(--slate-700); border: 1px solid var(--purple-200); border-radius: 10px; background: #fff; text-align: left; }
    .poll-option:hover, .poll-option.selected { border-color: var(--purple-600); color: var(--purple-800); background: #FAF4FB; }
    .poll-option input { accent-color: var(--green-600); }
    .news-list { display: grid; gap: 14px; }
    .news-item { display: flex; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--slate-100); }
    .news-item:last-child { padding-bottom: 0; border-bottom: 0; }
    .news-thumb { display: grid; flex: 0 0 auto; width: 52px; height: 52px; place-items: center; color: #fff; border-radius: 12px; background: linear-gradient(135deg, var(--purple-700), var(--pink-500)); }
    .news-item h3 { margin: 0 0 5px; color: var(--purple-950); font-size: .88rem; }
    .news-item p { margin: 0; color: var(--slate-500); font-size: .77rem; line-height: 1.4; }
    .news-item time { display: block; margin-top: 5px; color: var(--slate-500); font-size: .7rem; }
    .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .gallery-item { display: grid; aspect-ratio: 1; place-items: center; overflow: hidden; color: rgba(255,255,255,.8); border-radius: 10px; background: linear-gradient(135deg, #C8B4D1, #F5D4E7); font-size: 1.2rem; }
    .gallery-item:nth-child(2) { background: linear-gradient(135deg, #D9ED92, #B7DC42); }
    .gallery-item:nth-child(3) { background: linear-gradient(135deg, #C7D8F4, #C8B4D1); }
    .gallery-item:nth-child(4) { background: linear-gradient(135deg, #F5D4E7, #E8D58D); }
    .page-section { display: none; }
    .page-section.active { display: block; }
    .section-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .section-header h1 { margin: 0; color: var(--purple-950); font-size: 2rem; letter-spacing: -.04em; }
    .section-header p { margin: 7px 0 0; color: var(--slate-500); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .toolbar .input { max-width: 310px; }
    .toolbar .select { max-width: 190px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--slate-200); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; min-width: 680px; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--slate-100); text-align: left; font-size: .86rem; }
    th { color: var(--slate-500); font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; }
    td { color: var(--slate-700); }
    tr:last-child td { border-bottom: 0; }
    .empty-state { padding: 50px 20px; color: var(--slate-500); text-align: center; }
    .empty-state .empty-icon { margin-bottom: 12px; font-size: 2rem; }
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(50, 16, 71, .58); }
    .modal { width: min(100%, 620px); max-height: 90vh; overflow: auto; padding: 26px; border-radius: var(--radius-lg); background: #fff; box-shadow: var(--shadow); }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .modal-header h2 { margin: 0; color: var(--purple-950); }
    .close-button { display: grid; width: 36px; height: 36px; place-items: center; color: var(--slate-500); border: 1px solid var(--slate-200); border-radius: 10px; background: #fff; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .form-grid .full { grid-column: 1 / -1; }
    .textarea { min-height: 100px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .modal-actions .primary-button { width: auto; }
    .toast { position: fixed; z-index: 30; right: 22px; bottom: 22px; max-width: 360px; padding: 14px 17px; color: #fff; border-radius: 12px; background: var(--purple-950); box-shadow: var(--shadow); opacity: 0; transform: translateY(15px); pointer-events: none; transition: opacity .25s, transform .25s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @keyframes float { to { transform: translate3d(20px, -18px, 0) scale(1.05); } }
    @media (max-width: 1120px) { .login-screen { grid-template-columns: minmax(0, .85fr) minmax(400px, 1fr); } .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dashboard-grid { grid-template-columns: 1fr; } }
    @media (max-width: 820px) { .login-screen { display: block; } .login-visual { min-height: 380px; } .visual-content { min-height: 380px; padding: 28px; } .visual-logo { width: 190px; } .hero-copy { margin: 25px 0 0; padding: 0; } .hero-copy h1 { font-size: clamp(2.3rem, 10vw, 4rem); } .login-panel { min-height: 620px; padding: 46px 24px; } .mobile-brand { display: block; } .app-layout { display: block; } .sidebar { position: fixed; z-index: 12; left: 0; top: 0; width: 270px; transform: translateX(-105%); transition: transform .25s; box-shadow: var(--shadow); } .sidebar.open { transform: translateX(0); } .menu-button { display: grid; } .main-content { padding-top: 20px; } }
    @media (max-width: 560px) { .topbar { align-items: flex-start; } .top-actions .secondary-button { display: none; } .stats-grid, .project-grid, .form-grid { grid-template-columns: 1fr; } .form-grid .full { grid-column: auto; } .section-header { display: block; } .section-header .secondary-button { margin-top: 15px; } .content-card { padding: 17px; } .modal { padding: 20px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="app" class="app-shell"></main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    "use strict";
    const LOGO_PATH = "logo-tecna.jpg";
    const state = { loggedIn: false, currentPage: "dashboard", currentUser: { name: "Mariana Alves", course: "Informática", className: "Turma 302" }, projects: [{ title: "EcoTech", description: "Solução sustentável para reaproveitamento de materiais na escola.", progress: 78, area: "Sustentabilidade", status: "Em andamento", cover: "" }, { title: "Meninas na Robótica", description: "Oficinas e protótipos para aproximar estudantes da robótica.", progress: 52, area: "Robótica", status: "Em andamento", cover: "green" }, { title: "Conecta Saúde", description: "Protótipo de aplicativo para organizar informações de saúde.", progress: 34, area: "Aplicativos", status: "Planejamento", cover: "blue" }, { title: "Memória Digital", description: "Projeto para registrar histórias e memórias da comunidade escolar.", progress: 91, area: "Cultura", status: "Quase concluído", cover: "" }], news: [{ title: "Novo projeto de robótica cadastrado", text: "A equipe Meninas na Robótica compartilhou os primeiros protótipos.", date: "Hoje" }, { title: "Votação da semana aberta", text: "Escolha o projeto destaque da comunidade Tecna.", date: "Ontem" }, { title: "Galeria atualizada", text: "Novas fotos dos projetos já estão disponíveis.", date: "12 set" }], poll: { selected: "", voted: false } };
    const app = document.getElementById("app");
    const modalRoot = document.getElementById("modal-root");
    const toast = document.getElementById("toast");
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#039;", '"': "&quot;" }[character])); }
    function showToast(message) { toast.textContent = message; toast.classList.add("show"); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 3200); }
    function brandMarkup(classes = "brand-logo") { return `<img class="${classes}" src="${LOGO_PATH}" alt="Tecna — projetos que conectam" onerror="this.style.display='none'">`; }
    function renderLogin() { app.innerHTML = `<section class="login-screen" aria-label="Acesso ao Tecna"><section class="login-visual" aria-hidden="true"><canvas id="network-canvas"></canvas><div class="visual-content">${brandMarkup("brand-logo visual-logo")}<div class="hero-copy"><p class="eyebrow">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="hero-keywords"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></div></section><section class="login-panel"><div class="auth-card"><div class="mobile-brand">${brandMarkup("brand-logo mobile-logo")}</div><p class="eyebrow">Acesso à plataforma</p><h2>Bem-vinda ao Tecna</h2><p class="auth-intro">Entre para acompanhar e compartilhar projetos.</p><form id="login-form" novalidate><div class="form-group"><label for="login-email">E-mail</label><input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required></div><div class="form-group"><label for="login-password">Senha</label><div class="input-wrap"><input class="input password-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required minlength="4"><button class="toggle-password" type="button" data-toggle-password="login-password" aria-label="Mostrar senha">◉</button></div></div><div class="password-row"><label class="checkbox-label"><input type="checkbox" name="remember"> Lembrar de mim</label><button class="text-button" type="button" data-action="forgot-password">Esqueci minha senha</button></div><p id="login-message" class="auth-message" role="alert"></p><button class="primary-button" type="submit">Entrar</button></form><div class="auth-divider">ou</div><button class="secondary-button" type="button" data-action="create-account" style="width:100%">Criar uma conta</button><p class="auth-footer">Ambiente de demonstração do protótipo Tecna.</p></div></section></section>`; initCanvas(); }
    function renderApp() { app.innerHTML = `<div class="app-layout"><aside id="sidebar" class="sidebar">${brandMarkup("brand-logo sidebar-logo")}<nav class="sidebar-nav" aria-label="Navegação principal"><button class="nav-item ${state.currentPage === "dashboard" ? "active" : ""}" data-page="dashboard"><span class="nav-icon">⌂</span>Visão geral</button><button class="nav-item ${state.currentPage === "projects" ? "active" : ""}" data-page="projects"><span class="nav-icon">▣</span>Projetos</button><button class="nav-item ${state.currentPage === "news" ? "active" : ""}" data-page="news"><span class="nav-icon">✦</span>Notícias</button><button class="nav-item ${state.currentPage === "voting" ? "active" : ""}" data-page="voting"><span class="nav-icon">◉</span>Votações</button><button class="nav-item ${state.currentPage === "profile" ? "active" : ""}" data-page="profile"><span class="nav-icon">♙</span>Meu perfil</button></nav><div class="sidebar-bottom"><div class="profile-mini"><span class="avatar">MA</span><div><strong>${escapeHtml(state.currentUser.name)}</strong><small>${escapeHtml(state.currentUser.course)}</small></div></div><button class="logout-button" data-action="logout">↪ Sair da conta</button></div></aside><section class="main-content"><header class="topbar"><div><button id="menu-button" class="icon-button menu-button" data-action="toggle-menu" aria-label="Abrir menu">☰</button><h1>${pageTitle()}</h1><p>${pageSubtitle()}</p></div><div class="top-actions"><button class="secondary-button" data-action="create-project">+ Novo projeto</button><button class="icon-button" data-action="notifications" aria-label="Notificações">♧</button></div></header>${renderCurrentPage()}</section></div>`; }
    function pageTitle() { return ({ dashboard: `Olá, ${state.currentUser.name.split(" ")[0]}!`, projects: "Projetos", news: "Notícias do Tecna", voting: "Votações", profile: "Meu perfil" })[state.currentPage] || "Olá!"; }
    function pageSubtitle() { return ({ dashboard: "Acompanhe suas ideias e descubra novos projetos.", projects: "Explore projetos, equipes e ideias da comunidade.", news: "Acompanhe as novidades e conquistas da comunidade.", voting: "Participe das decisões e valorize projetos inspiradores.", profile: "Apresente sua trajetória e seus interesses." })[state.currentPage] || ""; }
    function renderCurrentPage() { if (state.currentPage === "projects") return renderProjectsPage(); if (state.currentPage === "news") return renderNewsPage(); if (state.currentPage === "voting") return renderVotingPage(); if (state.currentPage === "profile") return renderProfilePage(); return renderDashboard(); }
    function renderDashboard() { return `<section class="page-section active"><div class="stats-grid"><article class="stat-card"><span class="stat-label">Meus projetos</span><div class="stat-value">${state.projects.length}</div><div class="stat-trend">↑ 2 este mês</div></article><article class="stat-card"><span class="stat-label">Projetos acompanhados</span><div class="stat-value">8</div><div class="stat-trend">↑ 3 esta semana</div></article><article class="stat-card"><span class="stat-label">Sugestões recebidas</span><div class="stat-value">12</div><div class="stat-trend">4 aguardando análise</div></article><article class="stat-card"><span class="stat-label">Progresso médio</span><div class="stat-value">64%</div><div class="stat-trend">↑ 8% de evolução</div></article></div><div class="dashboard-grid"><article class="content-card"><div class="card-heading"><div><h2>Projetos em destaque</h2><p>Ideias que estão movimentando a comunidade.</p></div><button class="link-button" data-page="projects">Ver todos</button></div><div class="project-grid">${state.projects.slice(0, 4).map(projectCard).join("")}</div></article><div style="display:grid;gap:22px;align-content:start"><article class="content-card"><div class="card-heading"><div><h2>Votação aberta</h2><p>Sua opinião ajuda a dar visibilidade.</p></div><span class="status-pill purple">Ativa</span></div><div class="poll-box"><h3>Projeto destaque da semana</h3><p>Escolha uma das iniciativas da comunidade Tecna.</p><button class="poll-option" data-vote="EcoTech"><input type="radio" name="dashboard-vote" ${state.poll.selected === "EcoTech" ? "checked" : ""}> EcoTech</button><button class="poll-option" data-vote="Meninas na Robótica"><input type="radio" name="dashboard-vote" ${state.poll.selected === "Meninas na Robótica" ? "checked" : ""}> Meninas na Robótica</button><button class="primary-button button-small" data-action="vote" style="margin-top:14px">${state.poll.voted ? "Voto registrado" : "Votar agora"}</button></div></article><article class="content-card"><div class="card-heading"><div><h2>Notícias recentes</h2><p>O que está acontecendo no Tecna.</p></div><button class="link-button" data-page="news">Ver todas</button></div><div class="news-list">${state.news.slice(0, 2).map(newsItem).join("")}</div></article></div></div><article class="content-card" style="margin-top:22px"><div class="card-heading"><div><h2>Galeria de projetos</h2><p>Registros recentes das equipes em ação.</p></div><button class="link-button" data-page="projects">Explorar projetos</button></div><div class="gallery"><div class="gallery-item">✦</div><div class="gallery-item">⌁</div><div class="gallery-item">◈</div><div class="gallery-item">♡</div></div></article></section>`; }
    function projectCard(project) { return `<article class="project-card"><div class="project-cover ${escapeHtml(project.cover)}"><h3>${escapeHtml(project.title)}</h3></div><div class="project-body"><p>${escapeHtml(project.description)}</p><div class="progress-row"><span>Progresso</span><span>${project.progress}%</span></div><div class="progress-track" aria-label="${project.progress}% concluído"><div class="progress-bar" style="width:${project.progress}%"></div></div><div class="project-meta"><span>${escapeHtml(project.area)}</span><span class="status-pill ${project.progress < 60 ? "purple" : ""}">${escapeHtml(project.status)}</span></div></div></article>`; }
    function newsItem(item) { return `<article class="news-item"><div class="news-thumb" aria-hidden="true">✦</div><div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.text)}</p><time>${escapeHtml(item.date)}</time></div></article>`; }
    function renderProjectsPage() { return `<section class="page-section active"><div class="toolbar"><input class="input" id="project-search" type="search" placeholder="Buscar projeto..."><select class="select" id="project-filter"><option value="all">Todas as áreas</option><option value="Sustentabilidade">Sustentabilidade</option><option value="Robótica">Robótica</option><option value="Aplicativos">Aplicativos</option><option value="Cultura">Cultura</option><option value="Inteligência artificial">Inteligência artificial</option></select><button class="primary-button button-small" data-action="create-project">+ Cadastrar projeto</button></div><div id="projects-list" class="project-grid">${state.projects.map(projectCard).join("")}</div></section>`; }
    function renderNewsPage() { return `<section class="page-section active"><article class="content-card"><div class="card-heading"><div><h2>Atualizações da comunidade</h2><p>Notícias, comunicados e conquistas das equipes.</p></div><button class="secondary-button button-small" data-action="admin-news">Área editorial</button></div><div class="news-list">${state.news.map(newsItem).join("")}</div></article></section>`; }
    function renderVotingPage() { return `<section class="page-section active"><article class="content-card"><div class="card-heading"><div><h2>Projeto destaque da semana</h2><p>Vote uma vez e ajude a reconhecer uma iniciativa.</p></div><span class="status-pill purple">Encerra em 4 dias</span></div><div class="poll-box"><h3>Qual projeto merece destaque?</h3><p>O resultado será apresentado ao final da votação.</p><button class="poll-option ${state.poll.selected === "EcoTech" ? "selected" : ""}" data-vote="EcoTech"><input type="radio" name="page-vote" ${state.poll.selected === "EcoTech" ? "checked" : ""}> EcoTech <span style="margin-left:auto;color:var(--slate-500)">42 votos</span></button><button class="poll-option ${state.poll.selected === "Meninas na Robótica" ? "selected" : ""}" data-vote="Meninas na Robótica"><input type="radio" name="page-vote" ${state.poll.selected === "Meninas na Robótica" ? "checked" : ""}> Meninas na Robótica <span style="margin-left:auto;color:var(--slate-500)">37 votos</span></button><button class="primary-button button-small" data-action="vote" style="margin-top:16px">${state.poll.voted ? "Voto registrado" : "Registrar meu voto"}</button></div></article></section>`; }
    function renderProfilePage() { return `<section class="page-section active"><article class="content-card"><div style="display:flex;align-items:center;gap:18px;margin-bottom:25px"><span class="avatar" style="width:76px;height:76px;font-size:1.4rem">MA</span><div><h2 style="margin:0;color:var(--purple-950)">${escapeHtml(state.currentUser.name)}</h2><p style="margin:6px 0;color:var(--slate-500)">${escapeHtml(state.currentUser.course)} · ${escapeHtml(state.currentUser.className)}</p></div></div><div class="form-grid"><div class="form-group"><label>Nome completo</label><input class="input" value="${escapeHtml(state.currentUser.name)}"></div><div class="form-group"><label>Curso</label><input class="input" value="${escapeHtml(state.currentUser.course)}"></div><div class="form-group"><label>Turma</label><input class="input" value="${escapeHtml(state.currentUser.className)}"></div><div class="form-group"><label>Áreas de interesse</label><input class="input" value="Desenvolvimento web, IA"></div><div class="form-group full"><label>Sobre você</label><textarea class="textarea" placeholder="Conte brevemente sobre seus interesses...">Gosto de criar soluções que aproximam tecnologia e educação.</textarea></div></div><button class="primary-button button-small" data-action="save-profile" style="margin-top:8px">Salvar alterações</button></article></section>`; }
    function openModal(type) { if (type === "forgot") modalRoot.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><p class="eyebrow">Recuperação de acesso</p><h2 id="modal-title">Esqueci minha senha</h2></div><button class="close-button" data-close-modal aria-label="Fechar">×</button></div><p style="color:var(--slate-500);line-height:1.6">Informe seu e-mail. Em uma versão conectada, enviaremos um link temporário para criar uma nova senha.</p><form id="forgot-form"><div class="form-group"><label for="forgot-email">E-mail</label><input class="input" id="forgot-email" type="email" placeholder="voce@exemplo.com" required></div><button class="primary-button" type="submit">Enviar instruções</button></form></section></div>`; if (type === "account") modalRoot.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><p class="eyebrow">Faça parte da comunidade</p><h2 id="modal-title">Criar uma conta</h2></div><button class="close-button" data-close-modal aria-label="Fechar">×</button></div><form id="account-form"><div class="form-grid"><div class="form-group full"><label for="account-name">Nome completo</label><input class="input" id="account-name" required></div><div class="form-group"><label for="account-email">E-mail</label><input class="input" id="account-email" type="email" required></div><div class="form-group"><label for="account-course">Curso</label><input class="input" id="account-course" required></div><div class="form-group"><label for="account-class">Turma</label><input class="input" id="account-class" required></div><div class="form-group"><label for="account-password">Senha</label><input class="input" id="account-password" type="password" minlength="4" required></div><div class="form-group full"><label for="account-about">Breve apresentação</label><textarea class="textarea" id="account-about" placeholder="Conte um pouco sobre seus interesses..."></textarea></div></div><button class="primary-button" type="submit">Criar conta</button></form></section></div>`; if (type === "project") modalRoot.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><p class="eyebrow">Nova iniciativa</p><h2 id="modal-title">Cadastrar projeto</h2></div><button class="close-button" data-close-modal aria-label="Fechar">×</button></div><form id="project-form"><div class="form-grid"><div class="form-group full"><label for="project-title">Nome do projeto</label><input class="input" id="project-title" required></div><div class="form-group"><label for="project-area">Área</label><select class="select" id="project-area"><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select></div><div class="form-group"><label for="project-progress">Progresso inicial</label><input class="input" id="project-progress" type="number" min="0" max="100" value="0" required></div><div class="form-group full"><label for="project-description">Objetivo e descrição</label><textarea class="textarea" id="project-description" required></textarea></div></div><button class="primary-button" type="submit">Salvar projeto</button></form></section></div>`; }
    function closeModal() { modalRoot.innerHTML = ""; }
    function initCanvas() { const canvas = document.getElementById("network-canvas"); if (!canvas) return; const context = canvas.getContext("2d"); const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; const points = []; const pointer = { x: null, y: null }; const colors = ["#FFFFFF", "#DECBE2", "#F5D4E7", "#A8D719"]; let width = 0; let height = 0; function resize() { const ratio = Math.min(window.devicePixelRatio || 1, 2); width = canvas.clientWidth; height = canvas.clientHeight; canvas.width = width * ratio; canvas.height = height * ratio; context.setTransform(ratio, 0, 0, ratio, 0, 0); } function createPoints() { points.length = 0; const amount = Math.min(74, Math.max(28, Math.floor((width * height) / 17000))); for (let i = 0; i < amount; i += 1) points.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22, radius: Math.random() * 2.2 + 1, color: colors[i % colors.length] }); } function draw() { context.clearRect(0, 0, width, height); for (const point of points) { if (!reducedMotion) { point.x += point.vx; point.y += point.vy; if (point.x < 0 || point.x > width) point.vx *= -1; if (point.y < 0 || point.y > height) point.vy *= -1; } if (pointer.x !== null) { const dx = pointer.x - point.x; const dy = pointer.y - point.y; const distance = Math.hypot(dx, dy); if (distance < 130 && distance > 0) { point.x -= dx / distance * .12; point.y -= dy / distance * .12; } } } for (let i = 0; i < points.length; i += 1) for (let j = i + 1; j < points.length; j += 1) { const distance = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y); if (distance < 150) { context.strokeStyle = `rgba(255,255,255,${Math.max(0, .22 - distance / 900)})`; context.lineWidth = 1; context.beginPath(); context.moveTo(points[i].x, points[i].y); context.lineTo(points[j].x, points[j].y); context.stroke(); } } for (const point of points) { context.fillStyle = point.color; context.beginPath(); context.arc(point.x, point.y, point.radius, 0, Math.PI * 2); context.fill(); } if (!reducedMotion) window.requestAnimationFrame(draw); } resize(); createPoints(); draw(); window.addEventListener("resize", () => { resize(); createPoints(); if (reducedMotion) draw(); }); canvas.addEventListener("pointermove", event => { const bounds = canvas.getBoundingClientRect(); pointer.x = event.clientX - bounds.left; pointer.y = event.clientY - bounds.top; }); canvas.addEventListener("pointerleave", () => { pointer.x = null; pointer.y = null; }); }
    function login(event) { event.preventDefault(); const form = event.currentTarget; const message = document.getElementById("login-message"); const email = form.email.value.trim(); const password = form.password.value; if (!email || !email.includes("@")) { message.textContent = "Digite um e-mail válido."; return; } if (password.length < 4) { message.textContent = "A senha deve ter pelo menos 4 caracteres."; return; } state.loggedIn = true; state.currentPage = "dashboard"; renderApp(); showToast("Login realizado com sucesso. Bem-vinda ao Tecna!"); }
    function submitAccount(event) { event.preventDefault(); const name = document.getElementById("account-name").value.trim(); const course = document.getElementById("account-course").value.trim(); const className = document.getElementById("account-class").value.trim(); state.currentUser = { name: name || "Nova estudante", course: course || "Curso não informado", className: className || "Turma não informada" }; closeModal(); showToast("Conta criada no protótipo. Agora você já pode entrar."); }
    function submitProject(event) { event.preventDefault(); const title = document.getElementById("project-title").value.trim(); const description = document.getElementById("project-description").value.trim(); const area = document.getElementById("project-area").value; const progress = Math.max(0, Math.min(100, Number(document.getElementById("project-progress").value))); state.projects.unshift({ title, description, area, progress, status: progress >= 100 ? "Concluído" : progress > 0 ? "Em andamento" : "Planejamento", cover: "" }); closeModal(); renderApp(); showToast("Projeto cadastrado no protótipo."); }
    function handleAction(action) { if (action === "forgot-password") openModal("forgot"); if (action === "create-account") openModal("account"); if (action === "create-project") openModal("project"); if (action === "logout") { state.loggedIn = false; renderLogin(); showToast("Você saiu da conta."); } if (action === "notifications") showToast("Você não tem novas notificações."); if (action === "toggle-menu") document.getElementById("sidebar")?.classList.toggle("open"); if (action === "admin-news") showToast("A área editorial será liberada para perfis autorizados."); if (action === "save-profile") showToast("Alterações salvas no protótipo."); if (action === "vote") { if (!state.poll.selected) { showToast("Escolha uma opção antes de votar."); return; } state.poll.voted = true; renderApp(); showToast("Seu voto foi registrado com sucesso."); } }
    function setPage(page) { state.currentPage = page; renderApp(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    document.addEventListener("submit", event => { if (event.target.id === "login-form") login(event); if (event.target.id === "forgot-form") { event.preventDefault(); closeModal(); showToast("Se o e-mail estiver cadastrado, as instruções serão enviadas."); } if (event.target.id === "account-form") submitAccount(event); if (event.target.id === "project-form") submitProject(event); });
    document.addEventListener("click", event => { const actionElement = event.target.closest("[data-action]"); const pageElement = event.target.closest("[data-page]"); const voteElement = event.target.closest("[data-vote]"); if (event.target.matches("[data-close-modal]") || event.target.closest("[data-close-modal]")) if (event.target.classList.contains("modal-backdrop") || event.target.closest(".close-button")) closeModal(); if (actionElement) handleAction(actionElement.dataset.action); if (pageElement) setPage(pageElement.dataset.page); if (voteElement) { state.poll.selected = voteElement.dataset.vote; renderApp(); } const toggle = event.target.closest("[data-toggle-password]"); if (toggle) { const input = document.getElementById(toggle.dataset.togglePassword); input.type = input.type === "password" ? "text" : "password"; toggle.setAttribute("aria-label", input.type === "password" ? "Mostrar senha" : "Ocultar senha"); } });
    document.addEventListener("input", event => { if (event.target.id === "project-search" || event.target.id === "project-filter") { const query = document.getElementById("project-search")?.value.toLowerCase() || ""; const filter = document.getElementById("project-filter")?.value || "all"; const filtered = state.projects.filter(project => project.title.toLowerCase().includes(query) && (filter === "all" || project.area === filter)); const list = document.getElementById("projects-list"); if (list) list.innerHTML = filtered.length ? filtered.map(projectCard).join("") : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⌕</div>Nenhum projeto encontrado.</div>`; } });
    renderLogin();
  </script>
